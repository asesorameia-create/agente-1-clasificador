services:
  - type: web
    name: agente-1-clasificador
    runtime: docker
    plan: standard
    region: oregon
    envVars:
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_BUCKET_NAME
        value: agente-1-clasificador-fotos
